services:
  postgres:
    image: postgres:16-alpine
    container_name: clipforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge_dev_password
      POSTGRES_DB: clipforge
    ports:
      - "5432:5432"
    volumes:
      - clipforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clipforge_postgres_data:
